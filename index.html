<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entraînement tactique - Échiquier Mendois</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="trainer" aria-label="Application d'entraînement aux échecs">
        <div class="puzzle-card">
          <p class="message" id="message" aria-live="polite">Trait aux blancs</p>
          <p class="hint" id="hintText" hidden></p>
        </div>

        <aside class="controls">
          <label class="sr-only" for="categorySelect">Type d'exercice</label>
          <select id="categorySelect"></select>

          <button id="newPuzzleBtn" type="button">Nouvel exercice</button>

          <div class="button-row">
            <button id="hintBtn" type="button">Indice</button>
            <button id="solutionBtn" type="button">Voir la solution</button>
          </div>
        </aside>

        <div class="board-panel">
          <div id="board" class="board" role="grid" aria-label="Échiquier interactif"></div>
          <div class="score" aria-live="polite">
            0 réussite / 0 tentative
          </div>
        </div>

        <div class="correction-card">
          <p class="correction-message" id="correctionMessage" aria-live="polite"></p>
          <p class="explanation" id="explanationText" hidden></p>
        </div>
      </section>
    </main>

    <script src="vendor/chess.min.js"></script>
    <script src="data/puzzles.js"></script>
    <script src="app.js"></script>
  </body>
</html>
