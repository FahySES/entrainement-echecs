<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entraînement tactique - Échiquier Mendois</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="score" aria-live="polite">
        <span id="successCount">0</span> réussites / <span id="attemptCount">0</span> tentatives
      </div>

      <section class="trainer" aria-label="Application d'entraînement aux échecs">
        <aside class="controls">
          <label for="categorySelect">Type d'exercice</label>
          <select id="categorySelect"></select>

          <button id="newPuzzleBtn" type="button">Nouvel exercice</button>

          <div class="button-row">
            <button id="hintBtn" type="button">Indice</button>
            <button id="solutionBtn" type="button">Voir la solution</button>
          </div>
        </aside>

        <div class="board-panel">
          <div id="board" class="board" role="grid" aria-label="Échiquier interactif"></div>
          <div class="mobile-actions">
            <button id="mobileHintBtn" type="button">Indice</button>
            <button id="mobileSolutionBtn" type="button">Solution</button>
          </div>
        </div>

        <div class="puzzle-card">
          <p class="meta" id="puzzleMeta">-</p>
          <p class="message" id="message" aria-live="polite">À toi de jouer</p>
          <p class="hint" id="hintText" hidden></p>
          <p class="explanation" id="explanationText" hidden></p>
        </div>
      </section>
    </main>

    <script src="vendor/chess.min.js"></script>
    <script src="data/puzzles.js"></script>
    <script src="app.js"></script>
  </body>
</html>
